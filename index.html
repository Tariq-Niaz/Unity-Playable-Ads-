<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playable Ads Portfolio</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

header {
    text-align: center;
    padding: 30px 20px;
}

h1 {
    margin: 0;
    font-size: 28px;
}

p {
    color: #94a3b8;
}

.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 20px;
    padding: 20px;
}

.card {
    background: #1e293b;
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
    background: #334155;
}

.card a {
    text-decoration: none;
    color: white;
}

.thumbnail {
    height: 120px;
    border-radius: 10px;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #3b82f6, #9333ea);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 20px;
    color: #64748b;
}
</style>
</head>

<body>

<header>
    <h1>🎮 Playable Ads Portfolio</h1>
    <p>Tap any playable to try it</p>
</header>

<div class="container">

    <div class="card">
        <a href="Ad1.html">
            <div class="thumbnail">Ad 1</div>
            <h3>Playable Ad 1</h3>
        </a>
    </div>

    <div class="card">
        <a href="Ad2.html">
            <div class="thumbnail">Ad 2</div>
            <h3>Playable Ad 2</h3>
        </a>
    </div>

    <div class="card">
        <a href="Ad3.html">
            <div class="thumbnail">Ad 3</div>
            <h3>Playable Ad 3</h3>
        </a>
    </div>

    <div class="card">
        <a href="Ad4.html">
            <div class="thumbnail">Ad 4</div>
            <h3>Playable Ad 4</h3>
        </a>
    </div>

    <div class="card">
        <a href="Ad5.html">
            <div class="thumbnail">Ad 5</div>
            <h3>Playable Ad 5</h3>
        </a>
    </div>

    <div class="card">
        <a href="Ad6.html">
            <div class="thumbnail">Ad 6</div>
            <h3>Playable Ad 6</h3>
        </a>
    </div>

</div>

<footer>
    © 2026 Your Name | Unity Playable Ads
</footer>

</body>
</html>
