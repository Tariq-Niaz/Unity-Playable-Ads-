<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playable Ads Portfolio</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
}

h1 {
    padding: 20px;
    font-size: 28px;
}

.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 20px;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 15px;
    transition: 0.3s;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

.card:hover {
    transform: scale(1.05);
}

button {
    margin-top: 10px;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: #22c55e;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

iframe {
    width: 100%;
    height: 100vh;
    border: none;
    display: none;
}

.back {
    position: fixed;
    top: 10px;
    left: 10px;
    background: red;
    padding: 10px;
    border-radius: 10px;
    display: none;
    z-index: 1000;
}

/* Overlay message */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
}

.overlay-content {
    background: #1e293b;
    padding: 30px;
    border-radius: 15px;
    font-size: 20px;
}
</style>
</head>

<body>

<h1>🎮 My Playable Ads Portfolio</h1>

<div class="container">
    <div class="card">
        <h3>Ad 1</h3>
        <p>Best experienced in Landscape</p>
        <button onclick="openAd('Ad1.html','landscape')">Play</button>
    </div>

    <div class="card">
        <h3>Ad 2</h3>
        <p>Best experienced in Landscape</p>
        <button onclick="openAd('Ad2.html','landscape')">Play</button>
    </div>

    <div class="card">
        <h3>Ad 3</h3>
        <p>Best experienced in Landscape</p>
        <button onclick="openAd('Ad3.html','landscape')">Play</button>
    </div>

    <div class="card">
        <h3>Ad 4</h3>
        <p>Best experienced in Landscape</p>
        <button onclick="openAd('Ad4.html','landscape')">Play</button>
    </div>

    <div class="card">
        <h3>Ad 5</h3>
        <p>Best experienced in Portrait</p>
        <button onclick="openAd('Ad5.html','portrait')">Play</button>
    </div>

    <div class="card">
        <h3>Ad 6</h3>
        <p>Best experienced in Portrait</p>
        <button onclick="openAd('Ad6.html','portrait')">Play</button>
    </div>
</div>

<button class="back" onclick="closeAd()">⬅ Back</button>

<iframe id="player"></iframe>

<!-- Overlay -->
<div class="overlay" id="overlay">
    <div class="overlay-content" id="overlayText"></div>
</div>

<script>
const iframe = document.getElementById("player");
const backBtn = document.querySelector(".back");
const overlay = document.getElementById("overlay");
const overlayText = document.getElementById("overlayText");

function openAd(file, orientation) {
    iframe.src = file;
    iframe.style.display = "block";
    backBtn.style.display = "block";

    document.body.requestFullscreen().catch(()=>{});

    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock(orientation).catch(() => {
            showMessage(orientation);
        });
    } else {
        showMessage(orientation);
    }
}

function showMessage(orientation){
    overlay.style.display = "flex";

    if (orientation === "landscape") {
        overlayText.innerText = "🔄 Please rotate your phone to LANDSCAPE";
    } else {
        overlayText.innerText = "📱 Please rotate your phone to PORTRAIT";
    }

    setTimeout(() => {
        overlay.style.display = "none";
    }, 3000);
}

function closeAd() {
    iframe.style.display = "none";
    iframe.src = "";
    backBtn.style.display = "none";

    if (document.fullscreenElement) {
        document.exitFullscreen();
    }

    if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
    }
}
</script>

</body>
</html>
